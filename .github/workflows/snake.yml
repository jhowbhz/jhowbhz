name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22c55e&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Crop empty space around the grid
        run: |
          sudo python3 - <<'PY'
          import re
          p = "dist/github-snake-dark.svg"
          s = open(p).read()
          m = re.search(r'viewBox="(-?[\d.]+) (-?[\d.]+) ([\d.]+) ([\d.]+)" width="[\d.]+" height="[\d.]+"', s)
          x, y, w, h = map(float, m.groups())
          nw = w + 2 * x
          nh = 112
          s = s[:m.start()] + f'viewBox="0 0 {nw:g} {nh}" width="{nw:g}" height="{nh}"' + s[m.end():]
          open(p, "w").write(s)
          PY

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
